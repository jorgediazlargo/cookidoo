notas = """Los trucos del «wow»: el puerro pochado aporta dulzor (por eso gusta a los niños), el queso cottage da cremosidad y proteína sin nata, la patata y el aceite crudo triturado a fondo dan la textura aterciopelada, y el limón aviva el sabor y el verde. El calabacín suelta mucha agua: no añada más líquido al principio. Pelarlo a rayas y no pasarse de cocción mantiene el color verde brillante; para niños muy reacios a «lo verde», pélelo entero y queda más claro y suave.
Una vez añadido el cottage no lo deje hervir, o puede cortarse: recaliéntelo a 80 °C como máximo.
Para bebés, sin sal ni queso. Versión vegana: cambie el cottage por 30 g de anacardos crudos (tritúrelos con el resto en el paso 4).
Se conserva 3 días en la nevera. Para congelarlo, hágalo antes de añadir el cottage y añádalo al recalentar, triturando 30 seg/vel 7. En el TM5, sofría 6 min/Varoma/vel 1."""
