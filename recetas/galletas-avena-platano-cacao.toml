notas = """Cuanto más finas, más crujientes. Si las quiere más secas, apague el horno y déjelas dentro 10 min con la puerta entreabierta.
Con dátiles Medjool bastan 3-4 unidades. Si los dátiles están duros, remójelos 10 min en agua caliente y escúrralos: así se trituran del todo y no se notan.
Revise las etiquetas: dátiles sin jarabe ni conservantes, crema de cacahuete solo de cacahuete y cacao 100 % (sin alcalinizar si quiere evitar el E501).
Si la masa sigue muy pegajosa tras el reposo, añada 20 g más de copos de avena y mezcle 5 seg/vel 4.
Variante con chocolate: añada 40 g de chocolate negro 70 % troceado al final del paso 3 y mezcle 10 seg/giro inverso/vel 2 para no triturarlo.
Sin cacahuete: sustituya la crema de cacahuete por 25 g de aceite de oliva virgen extra suave.
Conserve en una lata a temperatura ambiente 4-5 días, no en el frigorífico (se ablandan). Se congelan bien."""
