notas = """Los trucos del «wow»: el puerro pochado aporta dulzor (por eso gusta a los niños), el parmesano da sabor profundo sin nata, la patata y el aceite crudo triturado a fondo dan la textura aterciopelada, y el limón aviva el sabor y el verde. El calabacín suelta mucha agua: no añada más líquido al principio. Pelarlo a rayas y no pasarse de cocción mantiene el color verde brillante; para niños muy reacios a «lo verde», pélelo entero y queda más claro y suave.
Para bebés, sin sal ni parmesano. Versión vegana: cambie el parmesano por 30 g de anacardos crudos (tritúrelos con el resto en el paso 5).
Se conserva 3 días en la nevera y se congela bien. En el TM5, sofría 6 min/Varoma/vel 1."""
